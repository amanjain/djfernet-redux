name: ci

on:
  push:
    branches: ["**"] # not tags: a release tag's commit was already tested on its branch
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches new Django, cryptography and psycopg releases
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tox factors: every Django env for that Python (plus oldest and flake8).
        python: [py38, py39, py310, py311, py312, py313, py314]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: tox.ini
      - run: uvx --with tox-uv tox run -f ${{ matrix.python }}

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Django supporting each server; 18 runs in "test".
        include:
          - postgres: "9.6"
            envs: py38-django22-pg,py39-django31-pg,py310-django32-pg
          - postgres: "10"
            envs: py310-django32-pg,py310-django40-pg
          - postgres: "11"
            envs: py310-django32-pg,py311-django41-pg
          - postgres: "12"
            envs: py311-django41-pg,py312-django42-pg,py312-django42-pg3,py312-django50-pg,py312-django50-pg3
          - postgres: "13"
            envs: py312-django50-pg,py312-django50-pg3,py313-django51-pg,py313-django51-pg3
          - postgres: "14"
            envs: py313-django51-pg3,py314-django52-pg,py314-django52-pg3,py314-django60-pg,py314-django60-pg3
          - postgres: "15"
            envs: py314-django52-pg3,py314-django61-pg,py314-django61-pg3
          - postgres: "16"
            envs: py314-django61-pg,py314-django61-pg3
          - postgres: "17"
            envs: py314-django61-pg,py314-django61-pg3
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: tox.ini
      - run: uvx --with tox-uv tox run -e ${{ matrix.envs }}
