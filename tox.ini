[tox]
requires = tox-uv
# Every Python × Django pair Django supports, on SQLite and PostgreSQL. psycopg2 is
# tested on every Django; psycopg 3 from Django 4.2, which added support for it.
# "oldest" pins the oldest supported dependencies (setup floors: Django 2.2,
# cryptography 3.1). PostgreSQL server versions are swept by the CI workflow.
envlist =
    py{38,39}-django{22,30,31}-{sqlite,pg}
    py{38,39,310}-django{32,40}-{sqlite,pg}
    py{38,39,310,311}-django41-{sqlite,pg}
    py{38,39,310,311,312}-django42-{sqlite,pg,pg3}
    py{310,311,312}-django50-{sqlite,pg,pg3}
    py{310,311,312,313}-django51-{sqlite,pg,pg3}
    py{310,311,312,313,314}-django52-{sqlite,pg,pg3}
    py{312,313,314}-django{60,61}-{sqlite,pg,pg3}
    py38-oldest-{sqlite,pg}
    py314-flake8

[testenv]
# Build the wheel once, with tox's Python: setuptools 77 needs Python 3.9+.
package = wheel
wheel_build_env = .pkg
deps =
    pytest
    pytest-django
    coverage
    !oldest: cryptography
    oldest: cryptography==3.1
    oldest: Django==2.2.*
    django22: Django>=2.2,<3.0
    django30: Django>=3.0,<3.1
    django31: Django>=3.1,<3.2
    django32: Django>=3.2,<4.0
    django40: Django>=4.0,<4.1
    django41: Django>=4.1,<4.2
    django42: Django>=4.2,<5.0
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    pg: psycopg2-binary
    pg3: psycopg[binary]
setenv =
    sqlite: DJANGO_SETTINGS_MODULE = fernet_fields.test.settings.sqlite
    pg,pg3: DJANGO_SETTINGS_MODULE = fernet_fields.test.settings.pg
passenv = DJFERNET_TEST_PG_*
commands =
    coverage run -a runtests.py fernet_fields/test --tb short

[testenv:py314-flake8]
deps = flake8
changedir = {toxinidir}
commands = flake8 .

[flake8]
exclude = .tox,.git,__pycache__,build
max-line-length = 100
